<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
<style>.t{font-family:Arial,sans-serif;fill:#24303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:22px}.m{font-size:18px;fill:#5d6570}.card{fill:#fff;stroke:#d7b8bd;stroke-width:2;rx:18}.bar{fill:#b6384a}.sig{fill:#f9efe2;stroke:#cc7d33;stroke-width:2;rx:10}</style>
<text x="550" y="42" text-anchor="middle" class="h">What does a gate do?</text>
<text x="550" y="72" text-anchor="middle" class="m">A gate multiplies the signal by a number between 0 and 1.</text>
<rect x="60" y="110" width="300" height="230" class="card"/><text x="210" y="150" text-anchor="middle" class="s t">gate = 0.1</text><rect x="105" y="200" width="210" height="24" fill="#f0eeea" rx="10"/><rect x="105" y="200" width="21.0" height="24" class="bar" rx="10"/><text x="210" y="260" text-anchor="middle" class="s t">input signal = 0.8</text><text x="210" y="295" text-anchor="middle" class="s t">output = 0.08</text><text x="210" y="323" text-anchor="middle" class="m">mostly block</text><rect x="400" y="110" width="300" height="230" class="card"/><text x="550" y="150" text-anchor="middle" class="s t">gate = 0.5</text><rect x="445" y="200" width="210" height="24" fill="#f0eeea" rx="10"/><rect x="445" y="200" width="105.0" height="24" class="bar" rx="10"/><text x="550" y="260" text-anchor="middle" class="s t">input signal = 0.8</text><text x="550" y="295" text-anchor="middle" class="s t">output = 0.40</text><text x="550" y="323" text-anchor="middle" class="m">keep half</text><rect x="740" y="110" width="300" height="230" class="card"/><text x="890" y="150" text-anchor="middle" class="s t">gate = 0.9</text><rect x="785" y="200" width="210" height="24" fill="#f0eeea" rx="10"/><rect x="785" y="200" width="189.0" height="24" class="bar" rx="10"/><text x="890" y="260" text-anchor="middle" class="s t">input signal = 0.8</text><text x="890" y="295" text-anchor="middle" class="s t">output = 0.72</text><text x="890" y="323" text-anchor="middle" class="m">mostly pass</text></svg>