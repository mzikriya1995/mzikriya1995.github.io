<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<style>.t{font-family:Arial,sans-serif;fill:#24303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:22px}.m{font-size:18px;fill:#5d6570}.card{fill:#fff;stroke:#d7b8bd;stroke-width:2;rx:18}.num{fill:#b6384a}.eq{font-size:20px;fill:#24303a}</style>
<text x="600" y="45" text-anchor="middle" class="h">One easy LSTM example</text>
<text x="600" y="75" text-anchor="middle" class="m">Suppose old memory = 0.40, forget gate = 0.80, input gate = 0.50, candidate = 0.60, output gate = 0.70.</text>
<rect x="80" y="150" width="220" height="200" class="card"/><text x="190" y="195" text-anchor="middle" class="s t">1. Keep old memory</text><text x="190" y="265" text-anchor="middle" class="eq">0.80 × 0.40 = 0.32</text><rect x="380" y="150" width="220" height="200" class="card"/><text x="490" y="195" text-anchor="middle" class="s t">2. Add new information</text><text x="490" y="265" text-anchor="middle" class="eq">0.50 × 0.60 = 0.30</text><rect x="680" y="150" width="220" height="200" class="card"/><text x="790" y="195" text-anchor="middle" class="s t">3. New memory</text><text x="790" y="265" text-anchor="middle" class="eq">c_t = 0.32 + 0.30 = 0.62</text><rect x="940" y="150" width="220" height="200" class="card"/><text x="1050" y="195" text-anchor="middle" class="s t">4. Hidden state</text><text x="1050" y="265" text-anchor="middle" class="eq">h_t = 0.70 × tanh(0.62) ≈ 0.39</text><text x="600" y="410" text-anchor="middle" class="s t">The LSTM does not just remember blindly. It chooses what to keep, what to add, and what to reveal.</text></svg>