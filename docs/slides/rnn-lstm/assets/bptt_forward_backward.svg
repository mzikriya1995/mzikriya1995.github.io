<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<style>.t{font-family:Arial,sans-serif;fill:#22303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:21px}.m{font-size:18px;fill:#5d6570}.rnn{fill:#fff7f7;stroke:#b6384a;stroke-width:3;rx:18}.loss{fill:#fff2d9;stroke:#d08a2f;stroke-width:2;rx:12}.in{fill:#f7fbff;stroke:#7f96aa;stroke-width:2;rx:10}.fwd{stroke:#2e6db4;stroke-width:4;marker-end:url(#mb)}.bwd{stroke:#c63f4f;stroke-width:4;marker-end:url(#mr)}</style>
<defs><marker id="mb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e6db4"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c63f4f"/></marker></defs>
<text x="600" y="40" text-anchor="middle" class="h">Backpropagation Through Time (BPTT)</text>
<text x="600" y="70" text-anchor="middle" class="m">Blue arrows show the forward pass. Red arrows show the backward gradient flow.</text>
<rect x="140" y="190" width="120" height="80" class="rnn"/><text x="200" y="225" text-anchor="middle" class="s t">RNN</text><text x="200" y="248" text-anchor="middle" class="m">step 1</text><rect x="170" y="320" width="60" height="38" class="in"/><text x="200" y="344" text-anchor="middle" class="m">x1</text><line x1="200" y1="320" x2="200" y2="270" class="fwd"/><rect x="164" y="120" width="72" height="38" class="loss"/><text x="200" y="145" text-anchor="middle" class="m">loss 1</text><line x1="200" y1="190" x2="200" y2="158" class="fwd"/><line x1="260" y1="230" x2="400" y2="230" class="fwd"/><line x1="400" y1="255" x2="260" y2="255" class="bwd"/><rect x="400" y="190" width="120" height="80" class="rnn"/><text x="460" y="225" text-anchor="middle" class="s t">RNN</text><text x="460" y="248" text-anchor="middle" class="m">step 2</text><rect x="430" y="320" width="60" height="38" class="in"/><text x="460" y="344" text-anchor="middle" class="m">x2</text><line x1="460" y1="320" x2="460" y2="270" class="fwd"/><rect x="424" y="120" width="72" height="38" class="loss"/><text x="460" y="145" text-anchor="middle" class="m">loss 2</text><line x1="460" y1="190" x2="460" y2="158" class="fwd"/><line x1="520" y1="230" x2="660" y2="230" class="fwd"/><line x1="660" y1="255" x2="520" y2="255" class="bwd"/><rect x="660" y="190" width="120" height="80" class="rnn"/><text x="720" y="225" text-anchor="middle" class="s t">RNN</text><text x="720" y="248" text-anchor="middle" class="m">step 3</text><rect x="690" y="320" width="60" height="38" class="in"/><text x="720" y="344" text-anchor="middle" class="m">x3</text><line x1="720" y1="320" x2="720" y2="270" class="fwd"/><rect x="684" y="120" width="72" height="38" class="loss"/><text x="720" y="145" text-anchor="middle" class="m">loss 3</text><line x1="720" y1="190" x2="720" y2="158" class="fwd"/><line x1="780" y1="230" x2="920" y2="230" class="fwd"/><line x1="920" y1="255" x2="780" y2="255" class="bwd"/><rect x="920" y="190" width="120" height="80" class="rnn"/><text x="980" y="225" text-anchor="middle" class="s t">RNN</text><text x="980" y="248" text-anchor="middle" class="m">step 4</text><rect x="950" y="320" width="60" height="38" class="in"/><text x="980" y="344" text-anchor="middle" class="m">x4</text><line x1="980" y1="320" x2="980" y2="270" class="fwd"/><rect x="944" y="120" width="72" height="38" class="loss"/><text x="980" y="145" text-anchor="middle" class="m">loss 4</text><line x1="980" y1="190" x2="980" y2="158" class="fwd"/><text x="600" y="410" text-anchor="middle" class="s t">During training, each use of the shared weights contributes to the total gradient.</text><text x="600" y="440" text-anchor="middle" class="m">Longer backward paths make vanishing and exploding gradients more likely.</text></svg>