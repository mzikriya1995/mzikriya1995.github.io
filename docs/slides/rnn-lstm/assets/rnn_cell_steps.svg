<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<style>
.t{font-family:Arial,sans-serif;fill:#22303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:22px}.m{font-size:18px;fill:#5d6570}.box{fill:#fff;stroke:#dcbcc2;stroke-width:2;rx:18}.rnn{fill:#fff7f7;stroke:#b6384a;stroke-width:3;rx:24}.circ{fill:#b6384a}.num{font-size:18px;font-weight:700;fill:#fff}.arrow{stroke:#8f2b3b;stroke-width:4;marker-end:url(#m)}.thin{stroke:#8f2b3b;stroke-width:3;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#8f2b3b"/></marker></defs>
<text x="600" y="45" text-anchor="middle" class="h">One RNN step: what happens at time t?</text>
<rect x="430" y="170" width="340" height="140" class="rnn"/>
<text x="600" y="220" text-anchor="middle" class="s t">RNN cell</text>
<text x="600" y="252" text-anchor="middle" class="m">combine current input and previous state</text>
<text x="600" y="282" text-anchor="middle" class="m">then produce a new hidden state</text>
<line x1="170" y1="240" x2="430" y2="240" class="arrow"/>
<text x="110" y="233" class="s t">current input</text><text x="115" y="260" class="s t">x<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<line x1="600" y1="130" x2="600" y2="170" class="arrow"/>
<text x="605" y="105" class="s t">previous hidden state h<tspan baseline-shift="sub" font-size="16">t-1</tspan></text>
<line x1="770" y1="240" x2="1010" y2="240" class="arrow"/>
<text x="1030" y="233" class="s t">new hidden state h<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<line x1="600" y1="310" x2="600" y2="405" class="thin"/>
<text x="615" y="375" class="s t">optional output ŷ<tspan baseline-shift="sub" font-size="16">t</tspan></text>
<circle cx="80" cy="430" r="18" class="circ"/><text x="80" y="436" text-anchor="middle" class="num">1</text><text x="110" y="436" class="m">Read the current input x_t.</text><circle cx="365" cy="430" r="18" class="circ"/><text x="365" y="436" text-anchor="middle" class="num">2</text><text x="395" y="436" class="m">Bring in the old hidden state h_{t-1}.</text><circle cx="650" cy="430" r="18" class="circ"/><text x="650" y="436" text-anchor="middle" class="num">3</text><text x="680" y="436" class="m">Mix them using the learned weights.</text><circle cx="935" cy="430" r="18" class="circ"/><text x="935" y="436" text-anchor="middle" class="num">4</text><text x="965" y="436" class="m">Send out the new state h_t (and maybe an output).</text></svg>