<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520">
<style>.t{font-family:Arial,sans-serif;fill:#24303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:21px}.m{font-size:18px;fill:#5d6570}.box{fill:#ffffff;stroke:#d8c3c7;stroke-width:2;rx:16}.mem{fill:#f7fbff;stroke:#6f95b5;stroke-width:3;rx:18}.gate{fill:#fff2d9;stroke:#d08a2f;stroke-width:2;rx:16}.cand{fill:#eef8ef;stroke:#5e9b67;stroke-width:2;rx:16}.out{fill:#fff7f7;stroke:#b6384a;stroke-width:3;rx:18}.arr{stroke:#8f2b3b;stroke-width:4;marker-end:url(#m)}.bar{stroke:#2e6db4;stroke-width:6;marker-end:url(#m2)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8f2b3b"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e6db4"/></marker></defs>
<text x="625" y="38" text-anchor="middle" class="h">A simple view of one LSTM step</text>
<text x="625" y="68" text-anchor="middle" class="m">Think of the blue line as the main memory path.</text>
<rect x="60" y="200" width="155" height="80" class="mem"/><text x="138" y="235" text-anchor="middle" class="s t">old memory</text><text x="138" y="260" text-anchor="middle" class="m">c(t−1)</text>
<line x1="215" y1="240" x2="310" y2="240" class="bar"/>
<rect x="310" y="160" width="140" height="80" class="gate"/><text x="380" y="195" text-anchor="middle" class="s t">forget gate</text><text x="380" y="220" text-anchor="middle" class="m">what to keep?</text>
<line x1="450" y1="200" x2="520" y2="200" class="arr"/>
<rect x="310" y="280" width="140" height="80" class="gate"/><text x="380" y="315" text-anchor="middle" class="s t">input gate</text><text x="380" y="340" text-anchor="middle" class="m">how much to write?</text>
<rect x="520" y="280" width="180" height="80" class="cand"/><text x="610" y="315" text-anchor="middle" class="s t">candidate memory</text><text x="610" y="340" text-anchor="middle" class="m">new useful information</text>
<line x1="450" y1="320" x2="520" y2="320" class="arr"/>
<line x1="700" y1="320" x2="790" y2="320" class="arr"/>
<rect x="790" y="200" width="170" height="80" class="mem"/><text x="875" y="235" text-anchor="middle" class="s t">new memory</text><text x="875" y="260" text-anchor="middle" class="m">c(t)</text>
<line x1="790" y1="240" x2="960" y2="240" class="bar"/>
<rect x="960" y="140" width="150" height="80" class="gate"/><text x="1035" y="175" text-anchor="middle" class="s t">output gate</text><text x="1035" y="200" text-anchor="middle" class="m">what to show?</text>
<line x1="1035" y1="220" x2="1035" y2="290" class="arr"/>
<rect x="930" y="290" width="210" height="90" class="out"/><text x="1035" y="330" text-anchor="middle" class="s t">hidden state h(t)</text><text x="1035" y="355" text-anchor="middle" class="m">value sent to the next layer / output</text>
<text x="625" y="445" text-anchor="middle" class="s t">Easy memory story: keep some old memory + add some new memory + show the part you need now.</text>
</svg>