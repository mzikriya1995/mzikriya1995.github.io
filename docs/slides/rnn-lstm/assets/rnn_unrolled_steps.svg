<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<style>.t{font-family:Arial,sans-serif;fill:#22303a}.h{font-size:30px;font-weight:700;fill:#7a2432}.s{font-size:22px}.m{font-size:18px;fill:#5d6570}.rnn{fill:#fff7f7;stroke:#b6384a;stroke-width:3;rx:18}.seq{fill:#f8fbff;stroke:#8d9cab;stroke-width:2;rx:12}.arr{stroke:#8f2b3b;stroke-width:4;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8f2b3b"/></marker></defs>
<text x="600" y="40" text-anchor="middle" class="h">Unrolling through time</text>
<text x="600" y="70" text-anchor="middle" class="m">The same RNN cell is reused at every timestep.</text>
<rect x="110" y="170" width="130" height="88" class="rnn"/><text x="175" y="208" text-anchor="middle" class="s t">RNN cell</text><text x="175" y="235" text-anchor="middle" class="m">step 1</text><rect x="143" y="310" width="64" height="42" class="seq"/><text x="175" y="337" text-anchor="middle" class="m">x1</text><line x1="175" y1="310" x2="175" y2="258" class="arr"/><text x="175" y="144" text-anchor="middle" class="m">h1</text><text x="90" y="210" text-anchor="end" class="m">start with h0</text><line x1="100" y1="214" x2="110" y2="214" class="arr"/><rect x="360" y="170" width="130" height="88" class="rnn"/><text x="425" y="208" text-anchor="middle" class="s t">RNN cell</text><text x="425" y="235" text-anchor="middle" class="m">step 2</text><rect x="393" y="310" width="64" height="42" class="seq"/><text x="425" y="337" text-anchor="middle" class="m">x2</text><line x1="425" y1="310" x2="425" y2="258" class="arr"/><text x="425" y="144" text-anchor="middle" class="m">h2</text><line x1="240" y1="214" x2="360" y2="214" class="arr"/><rect x="610" y="170" width="130" height="88" class="rnn"/><text x="675" y="208" text-anchor="middle" class="s t">RNN cell</text><text x="675" y="235" text-anchor="middle" class="m">step 3</text><rect x="643" y="310" width="64" height="42" class="seq"/><text x="675" y="337" text-anchor="middle" class="m">x3</text><line x1="675" y1="310" x2="675" y2="258" class="arr"/><text x="675" y="144" text-anchor="middle" class="m">h3</text><line x1="490" y1="214" x2="610" y2="214" class="arr"/><rect x="860" y="170" width="130" height="88" class="rnn"/><text x="925" y="208" text-anchor="middle" class="s t">RNN cell</text><text x="925" y="235" text-anchor="middle" class="m">step 4</text><rect x="893" y="310" width="64" height="42" class="seq"/><text x="925" y="337" text-anchor="middle" class="m">x4</text><line x1="925" y1="310" x2="925" y2="258" class="arr"/><text x="925" y="144" text-anchor="middle" class="m">h4</text><line x1="740" y1="214" x2="860" y2="214" class="arr"/><text x="600" y="395" text-anchor="middle" class="s t">Read left to right: each new state depends on the current input and the previous state.</text><text x="600" y="430" text-anchor="middle" class="m">Important: the weights are shared, so we learn one transition rule, not four separate networks.</text></svg>